server.port=8080

# ===== Database =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/furniture_store}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400}

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Errors =====
server.error.include-message=always
server.error.include-binding-errors=always

# ===== Telegram Support Bot =====
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:Riff_support_bot}
telegram.admin.chatId=${TELEGRAM_ADMIN_CHAT_ID}
telegram.web.baseUrl=${APP_BASE_URL:http://localhost:5173}

# ===== Logging =====
logging.level.org.springframework.security=${LOG_SECURITY:INFO}
logging.level.org.springframework.web=${LOG_WEB:INFO}
